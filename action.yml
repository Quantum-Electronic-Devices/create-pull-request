name: "Create pull request"
description: >
  Commits the modifications of already tracked files in the working tree to a
  new branch, pushes it and opens a pull request. Idempotent: if a pull request
  for the branch is open, merged, or was opened by this account and then declined
  by somebody else, nothing happens. A pull request that was opened by a
  different account, or that this account closed itself (to replace it), does
  not count, so a new one is opened.
  The calling job must check out the repository (preferably with
  `persist-credentials: false`), make its changes to tracked files, and grant
  `contents: write` and `pull-requests: write`.

inputs:
  github-token:
    required: true
    description: "A token that allows pushing a branch and creating a pull request in this repository."

  branch:
    required: true
    description: >
      Name of the branch to create. Use a name that is unique per change (for
      example one that contains the new version), because an existing pull
      request for the branch makes the action do nothing (see the description
      of the action for which pull requests count).

  title:
    required: true
    description: "Title of the pull request."

  body:
    required: false
    default: ""
    description: "Body of the pull request."

  commit-message:
    required: false
    default: ""
    description: "Commit message. Defaults to the pull request title."

  base-branch:
    required: false
    default: ${{ github.ref_name }}
    description: "Branch the pull request targets."

  labels:
    required: false
    default: ""
    description: >
      Comma-separated labels to add. A label that cannot be added (for example
      because it does not exist) only produces a warning.

  commit-user-name:
    required: false
    default: "github-actions[bot]"
    description: >
      Login of the account the commit is attributed to, e.g. the login of a
      bot account (or `<app-slug>[bot]` for a GitHub App). It should be the
      account `github-token` belongs to: when the token's own login cannot be
      determined (GITHUB_TOKEN, GitHub App tokens), it is used to recognise
      pull requests opened or closed by this action.

  commit-user-id:
    required: false
    default: "41898282"
    description: >
      Numeric user ID of that account (the default is the ID of github-actions[bot]
      on github.com). Look it up with: gh api users/<login> --jq .id
      (for an app: gh api "users/<app-slug>[bot]" --jq .id). It is used to build the
      commit email <id>+<login>@users.noreply.github.com, which links the commit to the account.

outputs:
  created:
    description: "'true' if a pull request was created by this run, otherwise 'false'."
    value: ${{ steps.create.outputs.created }}
  pull-request-url:
    description: "URL of the pull request that was created (empty if none was created)."
    value: ${{ steps.create.outputs.pull-request-url }}

runs:
  using: "composite"
  steps:
    - name: Create pull request
      id: create
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        BRANCH: ${{ inputs.branch }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        LABELS: ${{ inputs.labels }}
        COMMIT_USER_NAME: ${{ inputs.commit-user-name }}
        COMMIT_USER_ID: ${{ inputs.commit-user-id }}
      run: |
        set -u
        branch="${BRANCH}"
        title="${TITLE}"
        commit_message="${COMMIT_MESSAGE:-${TITLE}}"

        pr_url=""
        pushed=0
        created=0

        # Always publish the outputs. If this run pushed the branch but then
        # fails to open the pull request, remove the branch again so the next
        # run starts clean.
        cleanup() {
          local rc=$?
          trap - EXIT
          {
            if [[ ${created} -eq 1 ]]; then echo "created=true"; else echo "created=false"; fi
            echo "pull-request-url=${pr_url}"
          } >> "${GITHUB_OUTPUT}"
          if [[ ${rc} -ne 0 && ${pushed} -eq 1 && ${created} -eq 0 ]]; then
            echo "::warning::Removing branch ${branch} because the pull request could not be created"
            git push --quiet origin --delete "${branch}" || true
          fi
          exit "${rc}"
        }
        trap cleanup EXIT

        if [[ ! "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/+-]*$ ]] || ! git check-ref-format "refs/heads/${branch}"; then
          echo "::error::'branch' is not a valid branch name"
          exit 1
        fi
        if [[ ! "${COMMIT_USER_NAME}" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\[bot\])?$ ]]; then
          echo "::error::'commit-user-name' is not a valid GitHub login"
          exit 1
        fi
        if [[ ! "${COMMIT_USER_ID}" =~ ^[0-9]+$ ]]; then
          echo "::error::'commit-user-id' must be a number"
          exit 1
        fi
        author_email="${COMMIT_USER_ID}+${COMMIT_USER_NAME}@users.noreply.github.com"

        # The checkout does not persist credentials, so authenticate git with a
        # credential helper that reads the token from the environment when git
        # asks for it. The token never appears in a command line, a URL or the log.
        export GIT_TERMINAL_PROMPT=0
        export GIT_CONFIG_COUNT=2
        export GIT_CONFIG_KEY_0="credential.${SERVER_URL}.helper"
        export GIT_CONFIG_VALUE_0=""
        export GIT_CONFIG_KEY_1="credential.${SERVER_URL}.helper"
        export GIT_CONFIG_VALUE_1='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'

        # Login of the account that authors the pull request: the owner of the
        # token if it can be determined (personal access tokens), otherwise the
        # configured commit user (GITHUB_TOKEN, GitHub App tokens).
        me="$(gh api user --jq '.login' 2>/dev/null || true)"
        [[ -n "${me}" ]] || me="${COMMIT_USER_NAME}"

        # Idempotent (a schedule may run every day): a pull request for this exact
        # branch means there is nothing to do if it is
        #  - open or merged, or
        #  - opened by this account and closed by somebody else (declined).
        # It does not count if it was opened by a different account, or if this
        # account closed it itself (a replacement, e.g. by a forced run), so a
        # new one is opened then.
        # Assigned separately so that an API failure stops the run.
        existing="$(gh api -X GET "repos/${GH_REPO}/pulls" \
                      -f state=all -f per_page=100 -f head="${GH_REPO%%/*}:${branch}" \
                      --jq '.[] | [.number, .state, (if .merged_at then "merged" else "unmerged" end), .user.login] | @tsv')"
        # (No empty field in the output: read would merge adjacent tabs.)
        while IFS=$'\t' read -r pr_number pr_state pr_merged pr_author; do
          [[ -n "${pr_state}" ]] || continue
          blocks=0
          # GitHub logins are case-insensitive.
          if [[ "${pr_state}" == "open" || "${pr_merged}" == "merged" ]]; then
            blocks=1
          elif [[ "${pr_author,,}" == "${me,,}" ]]; then
            # Closed without merging and opened by this account: it only blocks
            # if somebody else closed it. An unknown closer counts as somebody else.
            closed_by="$(gh api "repos/${GH_REPO}/issues/${pr_number}" --jq '.closed_by.login // ""')"
            [[ "${closed_by,,}" == "${me,,}" ]] || blocks=1
          fi
          if [[ ${blocks} -eq 1 ]]; then
            echo "Pull request #${pr_number} for ${branch} already exists (${pr_state}, ${pr_merged}, opened by ${pr_author}), nothing to do"
            exit 0
          fi
        done <<< "${existing}"

        # Reaching this point means there is no pull request for the branch that
        # blocks a new one. If the branch itself exists it is a leftover of an
        # earlier run or the branch of a pull request declined by another account,
        # and may be based on an old commit, so it is rebuilt from the current
        # checkout and replaced. ls-remote also fails loudly on
        # an authentication problem instead of silently looking like "no branch".
        old_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)"

        git checkout --quiet -B "${branch}"
        # Only files that already exist are modified, so no untracked file can slip in.
        git add --update -- .
        if git diff --cached --quiet; then
          echo "::warning::The working tree has no changes to tracked files, no pull request needed"
          exit 0
        fi

        git -c user.name="${COMMIT_USER_NAME}" \
            -c user.email="${author_email}" \
            commit --quiet -m "${commit_message}"

        if [[ -n "${old_sha}" ]]; then
          echo "Branch ${branch} exists without a pull request (leftover of an earlier run), replacing it"
          # --force-with-lease: only overwrite the exact commit seen above, so a
          # push from somebody else in the meantime is never clobbered.
          git push --quiet --force-with-lease="refs/heads/${branch}:${old_sha}" origin "HEAD:refs/heads/${branch}"
        else
          git push --quiet origin "HEAD:refs/heads/${branch}"
        fi
        pushed=1

        pr_url="$(gh pr create --head "${branch}" --base "${BASE_BRANCH}" \
                    --title="${title}" --body="${BODY}")"
        created=1
        echo "Created ${pr_url}"

        # A missing label must not undo a successfully created pull request.
        IFS=',' read -r -a label_list <<< "${LABELS}"
        for label in "${label_list[@]}"; do
          label="${label#"${label%%[![:space:]]*}"}"
          label="${label%"${label##*[![:space:]]}"}"
          [[ -n "${label}" ]] || continue
          gh pr edit "${pr_url}" --add-label="${label}" || echo "::warning::Could not add the '${label}' label"
        done
